<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lazzat — 54 ta Retsept & Haqiqiy Google Gemini AI Oshpaz Portali</title>
  <meta name="description" content="54 xil sara taomlar retsepti, haqiqiy Google Gemini AI Vision (rasm orqali masalliq aniqlash), 346+ masalliqlar bazasi va sehrli aqlli oshxona.">

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Asosiy stillar -->
  <link rel="stylesheet" href="style.css">

  <!-- React 18 va ReactDOM UMD -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel Standalone (JSX ni brauzerda kompilyatsiya qilish uchun) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- 52 ta Retseptlar va AI bilimlari bazasi -->
  <script src="data.js"></script>
</head>
<body>
  <!-- React ildiz konteyneri -->
  <div id="root"></div>

  <!-- React Komponentlari va Logikasi (Babel JSX) -->
  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    function App() {
      // 1. STATE-LAR
      const [activeTab, setActiveTab] = useState("recipes");
      const [searchQuery, setSearchQuery] = useState("");
      const [favorites, setFavorites] = useState(() => {
        try {
          const saved = localStorage.getItem("lazzat_favorites_v2");
          return saved ? JSON.parse(saved) : [1, 3, 26, 46];
        } catch (e) {
          return [1, 3, 26, 46];
        }
      });
      const [recipes, setRecipes] = useState(window.RECIPES_DATA || []);
      const [selectedCategory, setSelectedCategory] = useState("all");
      const [sortBy, setSortBy] = useState("default");
      const [difficultyFilter, setDifficultyFilter] = useState("all");
      const [onlyFavorites, setOnlyFavorites] = useState(false);

      const [activeRecipe, setActiveRecipe] = useState(null);
      const [servingsCount, setServingsCount] = useState(4);
      const [checkedIngredients, setCheckedIngredients] = useState({});
      const [isFavoritesDrawerOpen, setIsFavoritesDrawerOpen] = useState(false);
      const [isAddModalOpen, setIsAddModalOpen] = useState(false);

      // Google Gemini AI Sozlamalari
      const [geminiApiKey, setGeminiApiKey] = useState(() => {
        try {
          return localStorage.getItem("lazzat_gemini_api_key") || "";
        } catch (e) {
          return "";
        }
      });
      const [isGeminiModalOpen, setIsGeminiModalOpen] = useState(false);
      const [geminiApiKeyInput, setGeminiApiKeyInput] = useState(() => {
        try {
          return localStorage.getItem("lazzat_gemini_api_key") || "";
        } catch (e) {
          return "";
        }
      });
      const [showApiKeyText, setShowApiKeyText] = useState(false);
      const [isTestingGemini, setIsTestingGemini] = useState(false);
      const [geminiTestStatus, setGeminiTestStatus] = useState(null);
      const [geminiTestMessage, setGeminiTestMessage] = useState("");

      // AI Masalliq O'rnini Bosish
      const [isSubModalOpen, setIsSubModalOpen] = useState(false);
      const [subQuery, setSubQuery] = useState("");
      const [subResult, setSubResult] = useState(null);
      const [isSubLoadingAi, setIsSubLoadingAi] = useState(false);

      // AI Menda Bor Masalliqlar (Sehrli Oshxona)
      const [fridgeIngredients, setFridgeIngredients] = useState([
        "Mol go'shti", "Sariq sabzi", "Lazer guruchi", "Piyoz"
      ]);
      const [customIngInput, setCustomIngInput] = useState("");
      const [ingredientCategoryFilter, setIngredientCategoryFilter] = useState("all");
      const [ingredientSearchQuery, setIngredientSearchQuery] = useState("");

      const [uploadedPhoto, setUploadedPhoto] = useState(null);
      const [isScanningPhoto, setIsScanningPhoto] = useState(false);
      const [photoScanTag, setPhotoScanTag] = useState("");
      const [isGeneratingAi, setIsGeneratingAi] = useState(false);
      const [aiMatchedRecipes, setAiMatchedRecipes] = useState(null);
      const [aiCustomDish, setAiCustomDish] = useState(null);

      // Taymer va Toast
      const [timerSeconds, setTimerSeconds] = useState(0);
      const [isTimerActive, setIsTimerActive] = useState(false);
      const [toastMessage, setToastMessage] = useState(null);

      const [newRecipeForm, setNewRecipeForm] = useState({
        title: "",
        category: "milliy",
        time: "",
        servings: 4,
        calories: "",
        difficulty: "Oson",
        description: "",
        image: "",
        ingredientsText: "",
        instructionsText: ""
      });

      useEffect(() => {
        try {
          localStorage.setItem("lazzat_favorites_v2", JSON.stringify(favorites));
        } catch (e) {
          console.error(e);
        }
      }, [favorites]);

      useEffect(() => {
        let interval = null;
        if (isTimerActive) {
          interval = setInterval(() => {
            setTimerSeconds(prev => prev + 1);
          }, 1000);
        } else {
          clearInterval(interval);
        }
        return () => clearInterval(interval);
      }, [isTimerActive]);

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => {
          setToastMessage(null);
        }, 3200);
      };

      // 2. EVENT HANDLERS
      const handleSearchChange = (e) => setSearchQuery(e.target.value);
      const handleClearSearch = () => setSearchQuery("");

      const toggleFavorite = (recipeId, e) => {
        if (e) e.stopPropagation();
        if (favorites.includes(recipeId)) {
          setFavorites(favorites.filter(id => id !== recipeId));
          showToast("💔 Retsept sevimlilardan olib tashlandi");
        } else {
          setFavorites([...favorites, recipeId]);
          showToast("❤️ Retsept sevimlilar ro'yxatiga qo'shildi!");
        }
      };

      const handleCategorySelect = (categoryId) => setSelectedCategory(categoryId);
      const handleSortChange = (e) => setSortBy(e.target.value);
      const handleDifficultyChange = (e) => setDifficultyFilter(e.target.value);

      const handleOpenRecipeModal = (recipe) => {
        setActiveRecipe(recipe);
        setServingsCount(recipe.servings || 4);
        setCheckedIngredients({});
        setTimerSeconds(0);
        setIsTimerActive(false);
      };

      const handleCloseRecipeModal = () => {
        setActiveRecipe(null);
        setIsTimerActive(false);
      };

      const handleServingChange = (delta) => {
        setServingsCount(prev => Math.max(1, Math.min(12, prev + delta)));
      };

      const handleToggleIngredient = (index) => {
        setCheckedIngredients(prev => ({ ...prev, [index]: !prev[index] }));
      };

      const toggleTimer = () => setIsTimerActive(prev => !prev);
      const resetTimer = () => {
        setIsTimerActive(false);
        setTimerSeconds(0);
      };

      const formatTimer = (totalSeconds) => {
        const mins = Math.floor(totalSeconds / 60);
        const secs = totalSeconds % 60;
        return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      };

      // GEMINI API SOZLAMALARI HANDLERLARI
      const handleSaveGeminiKey = () => {
        const key = geminiApiKeyInput.trim();
        if (!key) return;
        try {
          localStorage.setItem("lazzat_gemini_api_key", key);
          setGeminiApiKey(key);
          setGeminiTestStatus("success");
          setGeminiTestMessage("✅ Gemini API kaliti muvaffaqiyatli saqlandi!");
          showToast("✨ Google Gemini API muvaffaqiyatli ulandi!");
          setTimeout(() => {
            setIsGeminiModalOpen(false);
            setGeminiTestMessage("");
          }, 1200);
        } catch (e) {
          console.error(e);
        }
      };

      const handleDisconnectGemini = () => {
        try {
          localStorage.removeItem("lazzat_gemini_api_key");
          setGeminiApiKey("");
          setGeminiApiKeyInput("");
          setGeminiTestStatus(null);
          setGeminiTestMessage("");
          showToast("🔌 Gemini API kaliti o'chirildi");
        } catch (e) {
          console.error(e);
        }
      };

      const handleTestGeminiConnection = async () => {
        const testKey = geminiApiKeyInput.trim() || geminiApiKey;
        if (!testKey) {
          setGeminiTestStatus("error");
          setGeminiTestMessage("⚠️ Avval API kalitni kiriting!");
          return;
        }

        setIsTestingGemini(true);
        setGeminiTestStatus(null);
        setGeminiTestMessage("⚡ Google Gemini serveriga so'rov yuborilmoqda...");

        try {
          const testReply = await window.callGeminiApi({
            apiKey: testKey,
            prompt: "Salom! Agar aloqa yaxshi bo'lsa, 'OK' deb qisqa javob ber."
          });

          setGeminiTestStatus("success");
          setGeminiTestMessage(`✅ Aloqa o'rnatildi! Gemini javobi: "${testReply.trim().slice(0, 40)}"`);
          showToast("⚡ Gemini AI bilan aloqa a'lo darajada!");
        } catch (err) {
          setGeminiTestStatus("error");
          setGeminiTestMessage(`❌ Ulanish xatosi: ${err.message}`);
          showToast("❌ Gemini API ulanishida xatolik");
        } finally {
          setIsTestingGemini(false);
        }
      };

      // AI SUBSTITUTE LOGIC (LOKAL + HAQIQIY GEMINI AI)
      const handleOpenSubstituteModal = (initialIngredient = "") => {
        setIsSubModalOpen(true);
        setSubQuery(initialIngredient);
        if (initialIngredient) {
          findSubstitute(initialIngredient);
        } else {
          setSubResult(null);
        }
      };

      const findSubstitute = async (query) => {
        const q = query.toLowerCase().trim();
        if (!q) {
          setSubResult(null);
          return;
        }

        // 1. Avval mahalliy bilimlar bazasidan qidiramiz
        const db = window.AI_SUBSTITUTES || {};
        let foundKey = Object.keys(db).find(key => q.includes(key) || key.includes(q));

        if (foundKey) {
          setSubResult({
            ...db[foundKey],
            isGeminiLive: false
          });
        } else {
          setSubResult({
            name: `"${query}" uchun oshpazlik tavsiyasi`,
            alternatives: [
              "O'xshash toifadagi mahsulotdan foydalaning (masalan, go'sht turlari yoki sutli mahsulotlar bir-birini almashtiradi)",
              "Ziravor yetishmasa, qora murch, zira va osh tuzi bilan asosiy ta'mni mustahkamlang",
              "Agar asosiy masalliq bo'lmasa, taomdan olib tashlab, kartoshka yoki piyoz miqdorini ozroq oshiring"
            ],
            advice: `Ushbu retseptda "${query}" masallig'i bo'lmasa ham, to'g'ri olov me'yori orqali mazali taom tayyorlash mumkin!`,
            isGeminiLive: false
          });
        }

        // 2. Agar Gemini API kalit mavjud bo'lsa, 100% haqiqiy Gemini AI dan maslahat olamiz!
        const activeKey = geminiApiKey || localStorage.getItem("lazzat_gemini_api_key");
        if (activeKey) {
          setIsSubLoadingAi(true);
          try {
            const prompt = `Sen professional o'zbek va jahon bosh oshpazisan. Foydalanuvchi taom tayyorlashda quyidagi masalliq o'rniga uy sharoitida nima ishlatish mumkinligini so'ramoqda: "${query}".
Iltimos, o'zbek oshxonasi va har qanday xonadonda topiladigan 3-4 ta eng zo'r muqobilni (aniq proporsiyasi va ishlatilish usuli bilan) hamda bosh oshpazning oltin sirini o'zbek tilida ber.
Javobni FAQAT toza JSON formatida qaytar:
{
  "name": "${query}",
  "alternatives": [
    "1-muqobil: ...",
    "2-muqobil: ...",
    "3-muqobil: ..."
  ],
  "advice": "Oshpaz siri va maslahati..."
}`;

            const aiRaw = await window.callGeminiApi({
              apiKey: activeKey,
              prompt: prompt
            });

            const match = aiRaw.match(/\{[\s\S]*\}/);
            if (match) {
              const parsed = JSON.parse(match[0]);
              if (parsed.alternatives && parsed.alternatives.length > 0) {
                setSubResult({
                  name: parsed.name || query,
                  alternatives: parsed.alternatives,
                  advice: parsed.advice || "Taomni mehr bilan pishiring!",
                  isGeminiLive: true
                });
              }
            }
          } catch (err) {
            console.warn("Gemini substitute xatosi:", err.message);
          } finally {
            setIsSubLoadingAi(false);
          }
        }
      };

      const handleSubQueryChange = (e) => {
        const val = e.target.value;
        setSubQuery(val);
        findSubstitute(val);
      };

      // AI FRIDGE INGREDIENTS (MENDA BOR MASALLIQLAR)
      const handleAddFridgeIngredient = (ingName) => {
        const clean = (ingName || customIngInput).trim();
        if (!clean) return;
        if (!fridgeIngredients.some(i => i.toLowerCase() === clean.toLowerCase())) {
          setFridgeIngredients([...fridgeIngredients, clean]);
        }
        setCustomIngInput("");
      };

      const handleToggleFridgeIngredient = (ingName) => {
        const clean = ingName.trim();
        if (!clean) return;
        const exists = fridgeIngredients.some(i => i.toLowerCase() === clean.toLowerCase());
        if (exists) {
          setFridgeIngredients(fridgeIngredients.filter(i => i.toLowerCase() !== clean.toLowerCase()));
        } else {
          setFridgeIngredients([...fridgeIngredients, clean]);
        }
      };

      const handleRemoveFridgeIngredient = (index) => {
        setFridgeIngredients(fridgeIngredients.filter((_, idx) => idx !== index));
      };

      const handleClearFridgeIngredients = () => {
        setFridgeIngredients([]);
        setAiMatchedRecipes(null);
        setAiCustomDish(null);
        showToast("Masalliqlar ro'yxati tozalandi");
      };

      // RASM ORQALI MASALLIQNI ANIKLASH (HAQIQIY GEMINI VISION AI)
      const handlePhotoUpload = async (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = async (event) => {
          const dataUrl = event.target.result;
          setUploadedPhoto(dataUrl);
          setIsScanningPhoto(true);

          const activeKey = geminiApiKey || localStorage.getItem("lazzat_gemini_api_key");

          if (activeKey) {
            setPhotoScanTag("✨ Google Gemini Vision piksellarni skanerlamoqda...");
            try {
              const visionPrompt = `Sen professional bosh oshpaz va tasvirni tahlil qiluvchi mutaxassisisan.
Ushbu rasmda ko'rinib turgan BARCHA oziq-ovqat mahsulotlari, go'sht, sabzavotlar, guruch, donlar, mevalar yoki pishirish masalliqlarini sinchkovlik bilan aniqla.
Agar rasmda go'sht bo'lsa 'Go\\'sht', sabzi bo'lsa 'Sabzi', guruch bo'lsa 'Guruch' deb aniq va to'g'ri o'zbek tilida nomla.
Javobni FAQAT toza JSON formatida qaytar, boshqa hech qanday so'zsiz:
{
  "detected": ["Go'sht", "Sabzi", "Guruch"],
  "summary": "Rasmda to'g'ralgan go'sht, sariq sabzi va guruch aniqlandi."
}`;

              const mime = file.type || "image/jpeg";
              const rawAiResponse = await window.callGeminiApi({
                apiKey: activeKey,
                prompt: visionPrompt,
                imageBase64: dataUrl,
                mimeType: mime
              });

              let detectedList = [];
              let summaryText = "";

              try {
                const match = rawAiResponse.match(/\{[\s\S]*\}/);
                const parsed = JSON.parse(match ? match[0] : rawAiResponse);
                detectedList = parsed.detected || [];
                summaryText = parsed.summary || "";
              } catch (parseErr) {
                detectedList = rawAiResponse.split(/[\n,]/)
                  .map(s => s.trim().replace(/^[-*•0-9.]+\s*/, ''))
                  .filter(s => s.length > 2 && s.length < 30)
                  .slice(0, 8);
              }

              if (detectedList.length > 0) {
                const updated = [...new Set([...fridgeIngredients, ...detectedList])];
                setFridgeIngredients(updated);
                setPhotoScanTag(`✅ Gemini Vision aniqladi: ${detectedList.join(", ")}!`);
                showToast(`📸 Gemini Vision ${detectedList.length} ta masalliqni muvaffaqiyatli aniqladi!`);
              } else {
                setPhotoScanTag("⚠️ Rasmdan aniq masalliq ajratib bo'lmadi. Quyidagi ro'yxatdan tanlang.");
              }
            } catch (err) {
              console.error("Gemini Vision xatosi:", err);
              setPhotoScanTag(`❌ AI Xatolik: ${err.message}`);
              showToast("⚠️ Gemini API Vision so'rovida xatolik yuz berdi");
            } finally {
              setIsScanningPhoto(false);
            }
          } else {
            // Agar API kalit kiritilmagan bo'lsa
            setIsScanningPhoto(false);
            setPhotoScanTag("🔑 Rasmdagi go'sht, sabzi, guruchni 100% aniqlash uchun Gemini API kalitini ulang!");
            setIsGeminiModalOpen(true);
            showToast("💡 Rasmni haqiqiy AI bilan aniqlash uchun Gemini API kalitini kiriting!");
          }
        };
        reader.readAsDataURL(file);
      };

      // HAQIQIY GEMINI AI BILAN TAOM TAKLIF QILISH
      const handleGenerateAiRecipes = async () => {
        if (fridgeIngredients.length === 0) {
          showToast("⚠️ Avval kamida 2-3 ta masalliq qo'shing yoki tanlang!");
          return;
        }

        setIsGeneratingAi(true);

        // 1. Bazadagi 54 ta retsept bilan solishtirish (Match Score)
        const scored = recipes.map(recipe => {
          const recipeIngNames = recipe.ingredients.map(i => i.name.toLowerCase());
          let matches = 0;
          let missing = [];

          recipeIngNames.forEach(rIng => {
            const hasIt = fridgeIngredients.some(fIng => {
              const fi = fIng.toLowerCase();
              return rIng.includes(fi) || fi.includes(rIng.slice(0, 4));
            });
            if (hasIt) {
              matches++;
            } else {
              missing.push(rIng);
            }
          });

          const scorePercent = Math.min(100, Math.round((matches / Math.max(1, recipe.ingredients.length)) * 100));
          return {
            ...recipe,
            matchScore: scorePercent,
            missingIngredients: missing.slice(0, 3)
          };
        }).filter(r => r.matchScore > 15)
          .sort((a, b) => b.matchScore - a.matchScore)
          .slice(0, 6);

        setAiMatchedRecipes(scored.length > 0 ? scored : recipes.slice(0, 4));

        const activeKey = geminiApiKey || localStorage.getItem("lazzat_gemini_api_key");

        if (activeKey) {
          try {
            const ingredientsStr = fridgeIngredients.join(", ");
            const prompt = `Sen dunyoga mashhur professional bosh oshpazsan.
Foydalanuvchida bor masalliqlar: [${ingredientsStr}].

Vazifa:
1. Aynan shu masalliqlardan foydalanib, eng mazali va ishtahaochar "AI Mualliflik Retsepti" (O'zbekcha / xonaki uslubdagi mukammal taom) yaratib ber.
2. Kerakli miqdorlar, pishirish vaqti, kaloriya, bosqichma-bosqich qadamlar va bosh oshpaz sirini ber.

Javobni FAQAT quyidagi toza JSON formatida qaytar, boshqa hech qanday matnsiz:
{
  "title": "Taomning o'zbekcha chiroyli nomi",
  "time": 35,
  "servings": 4,
  "calories": 480,
  "difficulty": "O'rtacha",
  "description": "Taomning ishtahaochar 2 jumlali ta'rifi",
  "ingredients": ["300g Go'sht", "2 dona Sabzi", "200g Guruch", "1 dona Piyoz"],
  "steps": [
    "1-qadam...",
    "2-qadam...",
    "3-qadam...",
    "4-qadam..."
  ],
  "chefSecret": "Bosh oshpazning mazali chiqishi uchun eng muhim siri",
  "substituteAdvice": "Yetishmayotgan masalliqlar o'rniga nima ishlatish mumkinligi haqida maslahat"
}`;

            const rawAiResponse = await window.callGeminiApi({
              apiKey: activeKey,
              prompt: prompt
            });

            let parsedDish = null;
            try {
              const match = rawAiResponse.match(/\{[\s\S]*\}/);
              parsedDish = JSON.parse(match ? match[0] : rawAiResponse);
            } catch (pErr) {
              console.warn("AI JSON parse xatosi:", pErr);
            }

            if (parsedDish && parsedDish.title) {
              setAiCustomDish({
                title: parsedDish.title,
                time: parsedDish.time || 35,
                servings: parsedDish.servings || 4,
                calories: parsedDish.calories || 480,
                difficulty: parsedDish.difficulty || "O'rtacha",
                description: parsedDish.description || `Sizdagi ${ingredientsStr} masalliqlari asosida tayyorlanadigan maxsus taom.`,
                ingredients: parsedDish.ingredients || fridgeIngredients.map(i => `Kerakli miqdorda ${i}`),
                steps: parsedDish.steps || [
                  `1-qadam: ${fridgeIngredients[0] || "Masalliqlarni"} to'g'rab tayyorlab oling.`,
                  `2-qadam: Tovada qizigan yog'da qovurib, ziravorlar seping.`,
                  `3-qadam: Past olovda dimlab, dasturxonga torting.`
                ],
                chefSecret: parsedDish.chefSecret || "Taomni mehr bilan, me'yoriy olovda pishiring!",
                substituteAdvice: parsedDish.substituteAdvice || "",
                isGeminiPowered: true
              });
              showToast("✨ Gemini AI haqiqiy maxsus retsept yaratdi!");
            } else {
              throw new Error("Gemini javobini o'qib bo'lmadi");
            }
          } catch (err) {
            console.error("Gemini AI generatsiya xatosi:", err);
            showToast("⚠️ Gemini API xatoligi, mahalliy retsept taqdim etildi");
            createFallbackCustomDish();
          } finally {
            setIsGeneratingAi(false);
          }
        } else {
          // API Key yo'q bo'lsa lokal oshpazlik qoidalaridan foydalanamiz
          setTimeout(() => {
            createFallbackCustomDish();
            setIsGeneratingAi(false);
            showToast("✨ AI Oshpaz masalliqlaringiz asosida taom tavsiya qildi!");
          }, 900);
        }
      };

      const createFallbackCustomDish = () => {
        const ingsStr = fridgeIngredients.slice(0, 4).join(", ");
        setAiCustomDish({
          title: `Shohona Xonaki Qovurma (${fridgeIngredients[0] || "Go'sht"} va ${fridgeIngredients[1] || "Sabzavotlar"})`,
          time: 30,
          servings: 4,
          calories: 420,
          difficulty: "Oson",
          description: `Sizdagi ${ingsStr} masalliqlari uyg'unligida tayyorlanadigan yengil, to'yimli va mazali xonadon taomi.`,
          ingredients: fridgeIngredients.map(i => `300g ${i}`),
          steps: [
            `1-qadam: ${fridgeIngredients[0] || "Go'sht"} va boshqa masalliqlarni bir xil o'lchamda to'g'rab oling.`,
            `2-qadam: Qozonda yog'ni qizdirib, avval qattiqroq masalliqlarni 8-10 daqiqa baland olovda qovuring.`,
            `3-qadam: Qolgan masalliqlarni va ta'bga ko'ra tuz, murch va zira qo'shib aralashtiring.`,
            `4-qadam: Olovni pasaytirib, qopqog'ini yoping va 12 daqiqa dimlang.`
          ],

                        className="btn-toggle-eye" 
                        onClick={() => setShowApiKeyText(!showApiKeyText)}
                        title="Ko'rsatish / Yashirish"
                      >
                        {showApiKeyText ? "🙈" : "👁️"}
                      </button>
                    </div>
                  </div>

                  {/* Tugmalar */}
                  <div style={{ display: "flex", gap: "12px", marginBottom: "20px", flexWrap: "wrap" }}>
                    <button 
                      className="btn-primary-compact"
                      onClick={handleSaveGeminiKey}
                      disabled={!geminiApiKeyInput.trim()}
                    >
                      💾 Kalitni Saqlash
                    </button>

                    <button 
                      className="btn-secondary-compact"
                      onClick={handleTestGeminiConnection}
                      disabled={isTestingGemini || (!geminiApiKeyInput.trim() && !geminiApiKey)}
                    >
                      {isTestingGemini ? "⚡ Sinovdan o'tkazilmoqda..." : "🔌 Ulanishni Tekshirish"}
                    </button>

                    <a 
                      href="https://aistudio.google.com/app/apikey" 
                      target="_blank" 
                      rel="noopener noreferrer"
                      className="btn-get-key"
                    >
                      🔑 Bepul Kalit Olish (Google AI Studio) ↗
                    </a>
                  </div>

                  {/* Sinov xabari */}
                  {geminiTestMessage && (
                    <div style={{
                      padding: "12px 16px",
                      borderRadius: "var(--radius-sm)",
                      fontSize: "13px",
                      marginBottom: "16px",
                      background: geminiTestStatus === "success" ? "rgba(16,185,129,0.15)" : "rgba(239,68,68,0.15)",
                      border: `1px solid ${geminiTestStatus === "success" ? "#10b981" : "#ef4444"}`,
                      color: geminiTestStatus === "success" ? "#a7f3d0" : "#fca5a5"
                    }}>
                      {geminiTestMessage}
                    </div>
                  )}

                  {/* Ko'rsatma */}
                  <div className="ai-instructions-box" style={{ background: "rgba(0,0,0,0.3)", padding: "16px", borderRadius: "var(--radius-md)", fontSize: "12px", color: "var(--text-muted)", lineHeight: 1.7 }}>
                    <strong style={{ color: "#fff", display: "block", marginBottom: "6px" }}>💡 Bepul Gemini API Kalit Olish (1 Daqiqada):</strong>
                    1. <strong>aistudio.google.com/app/apikey</strong> manziliga kiring (Google hisobingiz bilan).<br/>
                    2. <strong>"Create API Key"</strong> tugmasini bosing va yaratilgan kalitni nusxalang.<br/>
                    3. Ushbu oynaga joylab <strong>"Kalitni Saqlash"</strong> tugmasini bosing.<br/>
                    <em>* Kalitingiz faqat sizning brauzeringizda xavfsiz saqlanadi va to'g'ridan-to'g'ri Google Gemini API serveriga ulanadi.</em>
                  </div>

                  <div style={{ textAlign: "right", marginTop: "18px" }}>
                    <button className="btn-primary-compact" onClick={() => setIsGeminiModalOpen(false)}>
                      Yopish
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Toast */}
          {toastMessage && (
            <div className="toast-notice">
              <span>🔔</span>
              <span>{toastMessage}</span>
            </div>
          )}

          {/* Footer */}
          <footer className="site-footer">
            <div className="container">
              <p style={{ fontWeight: "800", color: "var(--text-main)", marginBottom: "4px" }}>
                Lazzat — 54 ta Retsept & Haqiqiy Google Gemini AI Oshpaz Portali
              </p>
              <p>
                346+ masalliqlar bazasi, Google Gemini Vision rasm tahlili va interaktiv pazandachilik tizimi.
              </p>
            </div>
          </footer>
        </div>
      );
    }

    const rootElement = document.getElementById("root");
    if (rootElement) {
      const root = ReactDOM.createRoot(rootElement);
      root.render(<App />);
    }
  </script>
</body>
</html>
